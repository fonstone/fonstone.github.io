<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="880" height="520" rx="12" fill="#ffffff"/>
  <text x="440" y="38" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">同样 4bit，格点怎么摆决定模型会不会崩</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#6b7280">数轴为示意，格点位置不代表某一格式的精确编码</text>

  <text x="90" y="104" font-size="14" font-weight="600" fill="#1f2937">INT4，16 个等距格点</text>
  <line x1="100" y1="150" x2="780" y2="150" stroke="#374151" stroke-width="2"/>
  <g stroke="#2563eb" stroke-width="2">
    <line x1="100" y1="142" x2="100" y2="158"/><line x1="145" y1="142" x2="145" y2="158"/>
    <line x1="191" y1="142" x2="191" y2="158"/><line x1="236" y1="142" x2="236" y2="158"/>
    <line x1="281" y1="142" x2="281" y2="158"/><line x1="327" y1="142" x2="327" y2="158"/>
    <line x1="372" y1="142" x2="372" y2="158"/><line x1="417" y1="142" x2="417" y2="158"/>
    <line x1="463" y1="142" x2="463" y2="158"/><line x1="508" y1="142" x2="508" y2="158"/>
    <line x1="554" y1="142" x2="554" y2="158"/><line x1="599" y1="142" x2="599" y2="158"/>
    <line x1="645" y1="142" x2="645" y2="158"/><line x1="690" y1="142" x2="690" y2="158"/>
    <line x1="735" y1="142" x2="735" y2="158"/><line x1="780" y1="142" x2="780" y2="158"/>
  </g>
  <circle cx="770" cy="150" r="5" fill="#dc2626"/>
  <text x="780" y="180" text-anchor="end" font-size="12.5" fill="#dc2626">一个离群值把量程撑到端点</text>
  <text x="440" y="180" text-anchor="middle" font-size="12.5" fill="#6b7280">权重大多挤在原点附近，两端格点很少被用到</text>

  <text x="90" y="222" font-size="14" font-weight="600" fill="#1f2937">浮点 4bit，用指数位换动态范围</text>
  <line x1="100" y1="268" x2="780" y2="268" stroke="#374151" stroke-width="2"/>
  <g stroke="#0891b2" stroke-width="2">
    <line x1="100" y1="260" x2="100" y2="276"/><line x1="200" y1="260" x2="200" y2="276"/>
    <line x1="280" y1="260" x2="280" y2="276"/><line x1="340" y1="260" x2="340" y2="276"/>
    <line x1="385" y1="260" x2="385" y2="276"/><line x1="415" y1="260" x2="415" y2="276"/>
    <line x1="432" y1="260" x2="432" y2="276"/><line x1="448" y1="260" x2="448" y2="276"/>
    <line x1="465" y1="260" x2="465" y2="276"/><line x1="495" y1="260" x2="495" y2="276"/>
    <line x1="540" y1="260" x2="540" y2="276"/><line x1="600" y1="260" x2="600" y2="276"/>
    <line x1="680" y1="260" x2="680" y2="276"/><line x1="780" y1="260" x2="780" y2="276"/>
  </g>
  <text x="440" y="298" text-anchor="middle" font-size="12.5" fill="#0891b2">原点附近更密，远端更疏，离群值不再独占量程</text>

  <text x="90" y="340" font-size="14" font-weight="600" fill="#1f2937">HiF4，把缩放拆成三层</text>
  <rect x="100" y="356" width="680" height="72" rx="6" fill="#f0f9ff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="116" y="378" font-size="12.5" fill="#0e7490">64 个元素共享一个 E6M2 块级 scale</text>
  <g>
    <rect x="116" y="388" width="150" height="30" rx="3" fill="#ffffff" stroke="#0891b2"/>
    <rect x="276" y="388" width="150" height="30" rx="3" fill="#ffffff" stroke="#0891b2"/>
    <rect x="436" y="388" width="150" height="30" rx="3" fill="#ffffff" stroke="#0891b2"/>
    <rect x="596" y="388" width="168" height="30" rx="3" fill="#ffffff" stroke="#0891b2"/>
  </g>
  <g stroke="#7dd3fc" stroke-width="1">
    <line x1="191" y1="388" x2="191" y2="418"/><line x1="351" y1="388" x2="351" y2="418"/>
    <line x1="511" y1="388" x2="511" y2="418"/><line x1="680" y1="388" x2="680" y2="418"/>
  </g>
  <text x="116" y="446" font-size="12.5" fill="#374151">8 元素与 4 元素级各带 1bit 细化因子，元素本身是 E1M2，合计约 4.5 bit 每个值</text>

  <rect x="90" y="462" width="700" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="108" y="490" font-size="12.5" fill="#1e3a8a">W4A4 下 INT4 精度崩塌，HiF4 在 Qwen3-8B 上保留 BF16 的 96.5% 以上，openPangu-7B 为 97.0%。</text>
</svg>
