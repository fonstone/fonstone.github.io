<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">BBFP 数据格式，双向块浮点</text>

  <text x="150" y="78" font-size="13.5" fill="#374151">BBFP(m, o)，BBAL 论文格式</text>
  <g stroke-width="1.5">
    <rect x="150" y="90" width="36" height="40" rx="3" fill="#e5e7eb" stroke="#6b7280"/>
    <rect x="190" y="90" width="36" height="40" rx="3" fill="#fde68a" stroke="#d97706"/>
    <rect x="230" y="90" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="270" y="90" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="310" y="90" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="350" y="90" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="390" y="90" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="430" y="90" width="36" height="40" rx="3" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="470" y="90" width="36" height="40" rx="3" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="510" y="90" width="36" height="40" rx="3" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="550" y="90" width="36" height="40" rx="3" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="590" y="90" width="36" height="40" rx="3" fill="#fbcfe8" stroke="#be185d"/>
    <rect x="630" y="90" width="36" height="40" rx="3" fill="#fbcfe8" stroke="#be185d"/>
  </g>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="168" y="114">符</text>
    <text x="208" y="114">标</text>
    <text x="310" y="114">共</text>
    <text x="490" y="114">尾</text>
    <text x="608" y="114">重</text>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="168" y="150">符号 1bit</text>
    <text x="208" y="150">标志 1bit</text>
    <text x="310" y="150">共享指数 5bit</text>
    <text x="490" y="150">尾数 m bit</text>
    <text x="608" y="150">重叠 o bit</text>
  </g>

  <text x="150" y="190" font-size="13.5" fill="#374151">vanilla BFP，整块对齐到最大指数</text>
  <g stroke-width="1.5">
    <rect x="150" y="202" width="36" height="40" rx="3" fill="#e5e7eb" stroke="#6b7280"/>
    <rect x="190" y="202" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="230" y="202" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="270" y="202" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="310" y="202" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="350" y="202" width="36" height="40" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="390" y="202" width="36" height="40" rx="3" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="430" y="202" width="36" height="40" rx="3" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="470" y="202" width="36" height="40" rx="3" fill="#93c5fd" stroke="#2563eb"/>
    <rect x="510" y="202" width="36" height="40" rx="3" fill="#93c5fd" stroke="#2563eb"/>
  </g>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="168" y="226">符</text>
    <text x="270" y="226">共</text>
    <text x="450" y="226">尾</text>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="168" y="262">符号 1bit</text>
    <text x="270" y="262">共享指数 5bit</text>
    <text x="450" y="262">尾数 m bit</text>
  </g>

  <text x="150" y="306" font-size="12.5" fill="#6b7280">标志位把块内值分成高尾数和低尾数两组，小值和中值不再被最大指数拖死，离群值仍能表达。</text>
  <text x="150" y="334" font-size="12.5" fill="#6b7280">BBFP(3,1) 比 BFP4 提升 6%，BBFP(4,2) 的困惑度比 OmniQuant 低 33%，数据来自 BBAL 论文。</text>
</svg>