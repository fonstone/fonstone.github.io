<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">块浮点，一个块共享一个指数</text>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#6b7280">8 个值一块示意，尾数各存一份，指数全块只存一份</text>

  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
    <rect x="110" y="90" width="56" height="40" rx="4"/>
    <rect x="182" y="90" width="56" height="40" rx="4"/>
    <rect x="254" y="90" width="56" height="40" rx="4"/>
    <rect x="326" y="90" width="56" height="40" rx="4"/>
    <rect x="398" y="90" width="56" height="40" rx="4"/>
    <rect x="470" y="90" width="56" height="40" rx="4"/>
    <rect x="542" y="90" width="56" height="40" rx="4"/>
    <rect x="614" y="90" width="56" height="40" rx="4"/>
  </g>
  <g font-size="12" fill="#1e40af" text-anchor="middle">
    <text x="138" y="115">尾数1</text>
    <text x="210" y="115">尾数2</text>
    <text x="282" y="115">尾数3</text>
    <text x="354" y="115">尾数4</text>
    <text x="426" y="115">尾数5</text>
    <text x="498" y="115">尾数6</text>
    <text x="570" y="115">尾数7</text>
    <text x="642" y="115">尾数8</text>
  </g>
  <line x1="110" y1="136" x2="670" y2="136" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="250" y1="136" x2="250" y2="160" stroke="#2563eb" stroke-width="1.5"/>

  <rect x="200" y="160" width="320" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="187" text-anchor="middle" font-size="14" fill="#92400e">共享指数（常用 5bit，块内一份）</text>
  <text x="430" y="232" text-anchor="middle" font-size="12.5" fill="#6b7280">乘加变成整数乘加，指数只加一次。动态范围由共享指数提供，精度按块重分配。</text>

  <text x="430" y="276" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">llama.cpp 的 Q3_K，两级缩放结构</text>
  <rect x="100" y="296" width="660" height="56" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="112" y="318" font-size="13" fill="#374151">超块 256 个权重</text>
  <g fill="#e5e7eb" stroke="#6b7280" stroke-width="1">
    <rect x="140" y="326" width="33" height="16" rx="2"/>
    <rect x="178" y="326" width="33" height="16" rx="2"/>
    <rect x="216" y="326" width="33" height="16" rx="2"/>
    <rect x="254" y="326" width="33" height="16" rx="2"/>
    <rect x="292" y="326" width="33" height="16" rx="2"/>
    <rect x="330" y="326" width="33" height="16" rx="2"/>
    <rect x="368" y="326" width="33" height="16" rx="2"/>
    <rect x="406" y="326" width="33" height="16" rx="2"/>
    <rect x="444" y="326" width="33" height="16" rx="2"/>
    <rect x="482" y="326" width="33" height="16" rx="2"/>
    <rect x="520" y="326" width="33" height="16" rx="2"/>
    <rect x="558" y="326" width="33" height="16" rx="2"/>
    <rect x="596" y="326" width="33" height="16" rx="2"/>
    <rect x="634" y="326" width="33" height="16" rx="2"/>
    <rect x="672" y="326" width="33" height="16" rx="2"/>
    <rect x="710" y="326" width="33" height="16" rx="2"/>
  </g>
  <text x="704" y="372" text-anchor="end" font-size="12" fill="#6b7280">16 个块，每块 16 个权重</text>

  <rect x="100" y="392" width="420" height="44" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="310" y="419" text-anchor="middle" font-size="13.5" fill="#3730a3">单个块 16 个权重 + 6bit 块缩放因子（BSF）</text>
  <rect x="540" y="392" width="220" height="44" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="650" y="419" text-anchor="middle" font-size="13.5" fill="#9d174d">超块级 16bit 超缩放因子（SSF）</text>

  <text x="100" y="470" font-size="12.5" fill="#6b7280">两级缩放摊薄存储，Q3_K 平均约 3.5bit 每权重，Q2_K 约 2.6bit，来源是 F-BFQ 论文整理的 GGUF 格式。</text>
  <text x="100" y="496" font-size="12.5" fill="#6b7280">主要误差来源是整块对齐到最大指数，小值和中值被截断，BBAL 和 DB-Attn 论文都在这上面做改进。</text>
</svg>