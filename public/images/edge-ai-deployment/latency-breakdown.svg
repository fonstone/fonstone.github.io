<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="360" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">端到端时延构成，解码占大头</text>
  <rect x="560" y="48" width="16" height="16" fill="#2563eb"/>
  <text x="584" y="61" font-size="13" fill="#374151">解码</text>
  <rect x="640" y="48" width="16" height="16" fill="#93c5fd"/>
  <text x="664" y="61" font-size="13" fill="#374151">prefill 与其余</text>

  <text x="30" y="112" font-size="14" fill="#111827">问答任务</text>
  <rect x="220" y="88" width="541" height="44" rx="4" fill="#2563eb"/>
  <text x="490" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">解码 90.2%</text>
  <rect x="761" y="88" width="59" height="44" rx="4" fill="#93c5fd"/>
  <text x="790" y="116" text-anchor="middle" font-size="12" fill="#1e3a8a">9.8%</text>

  <text x="30" y="172" font-size="14" fill="#111827">总结任务</text>
  <rect x="220" y="148" width="523" height="44" rx="4" fill="#2563eb"/>
  <text x="481" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">解码 87.2%</text>
  <rect x="743" y="148" width="77" height="44" rx="4" fill="#93c5fd"/>
  <text x="781" y="176" text-anchor="middle" font-size="12" fill="#1e3a8a">12.8%</text>

  <line x1="220" y1="200" x2="820" y2="200" stroke="#9ca3af" stroke-width="1"/>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="220" y="216">0%</text>
    <text x="370" y="216">25%</text>
    <text x="520" y="216">50%</text>
    <text x="670" y="216">75%</text>
    <text x="820" y="216">100%</text>
  </g>

  <text x="30" y="256" font-size="12.5" fill="#6b7280">解码阶段每个 token 都要把全部权重读一遍，NPU 利用率低，这是时延大头。prefill 在 NPU 上已经超过每秒 1000 token。</text>
  <text x="30" y="284" font-size="12.5" fill="#6b7280">数据来自 sd.npu 论文，OnePlus 13 上跑 Qwen2.5-1.5B。</text>
</svg>